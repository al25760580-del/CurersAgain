"startup.intro.0" = "In the year 20XX, an unexpected online takeover began."
"startup.intro.1" = "A new group of idols surfaced on the internet,\nknown as virtual idols."
"startup.intro.2" = "People were skeptical at first, but over time,\nthese virtual idols gathered many fans."
"startup.intro.3" = "Many grew to love these 'vtubers' very much."
"startup.intro.4" = "However, one day an evil force came in and\ntook advantage of the fans and their love."
"startup.intro.5" = "The evil force brainwashed the fans, turning them into\nmindless minions blinded by their own love."
"startup.intro.6" = "The vtubers knew they had to help their fans\ncome back to their senses."
"startup.intro.7" = "And thus began their quest...\n\n...to save the fans!"

